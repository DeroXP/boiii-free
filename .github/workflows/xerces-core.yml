name: Xerces core

on: [push, pull_request]

jobs:
  core:
    name: Core tests
    runs-on: windows-2025
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Fence lint
        run: python tools/ci/check_fenced.py

      - name: Host lint
        run: python tools/ci/check_hosts.py

      - name: Upstream updater and -beta download stay off
        run: python tools/ci/check_switches.py

      - name: Launcher colour contrast
        run: python tools/ci/check_contrast.py

      - name: Launcher tokens generated
        run: python tools/ui/tokens.py --check

      - name: Launcher string template current
        run: python tools/i18n/extract_strings.py --check

      - name: Package licence scan patterns
        run: python tools/release/notices.py --self-test

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 23

      - name: Install premake5
        uses: Jarod42/install-premake5@v7
        with:
          msdev: vs2026
          ref: v5.0.0

      - name: Generate project files
        run: premake5 ninja

      - name: Build the core, tests and CLI
        run: ninja -C build bin/x64/Release/xerces_tests.exe bin/x64/Release/xerces_cli.exe

      - name: Unit tests
        run: build/bin/x64/Release/xerces_tests.exe

      - name: CLI smoke test
        run: >-
          build/bin/x64/Release/xerces_cli.exe conflicts check
          --mods-dir tests/fixtures/mods --mod fixture.alpha --mod fixture.beta
          --stock tests/fixtures/stock

      - name: CLI smoke test (home commands, dry launches only)
        run: ./tools/ci/cli_smoke.ps1 -Generate

  # The game client from a clean checkout, Release, as a beta package is built
  # (tools/release.ps1). Nothing is uploaded or published: upstream's publish
  # workflows were removed, and releases are made by hand.
  client:
    name: Client build (Release)
    if: github.event_name == 'push'
    runs-on: windows-2025
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Upstream updater and -beta download stay off
        run: python tools/ci/check_switches.py

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 23

      - name: Install premake5
        uses: Jarod42/install-premake5@v7
        with:
          msdev: vs2026
          ref: v5.0.0

      - name: Generate project files
        run: premake5 ninja

      - name: Build boiii.exe
        run: ninja -C build bin/x64/Release/boiii.exe
